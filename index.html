<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Netflex website</title>

    <!-- Tailwind CDN Link -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <!-- ================== Banner Section Start =================== -->

    <section
      class="relative w-[100%] h-[100vh] bg-[url('/Images/Netflix-Background.jpg')] bg-center bg-cover"
    >
      <!-- Overlay Effect -->
      <div class="absolute inset-0 bg-black/70 z-10"></div>

      <!-- Content -->
      <div class="relative z-20 max-w-[1170px] mx-auto h-[100vh]">
        <!-- Navigation Bar -->
        <header class="relative">
          <div
            class="grid flex-row justify-between sm:grid-cols-2 sm:grid-col-2-[30%_auto] px-10 pt-8 items-center"
          >
            <!-- NavBar Logo-->
            <figure class="sm:w-[148px] w-[100%] relative overflow-hidden">
              <img
                src="/Images/Netflix-symbol.jpg"
                alt="Netflix Logo"
                class="w-full h-auto rounded-lg transition duration-300 ease-in-out transform hover:scale-105 hover:brightness-75"
              />
            </figure>

            <!-- Navbar buttons -->
            <div
              class="flex flex-col sm:flex-row sm:justify-end space-y-4 sm:space-y-0 sm:space-x-4 mt-3"
            >
              <div
                class="w-full sm:w-auto sm:flex items-center justify-center sm:justify-end"
              >
                <select
                  class="w-full sm:w-30 h-10 text-white border-2 border-gray-400 hover:border-red-500 rounded-md bg-transparent px-2"
                >
                  <option value="">English</option>
                  <option value="">Urdu</option>
                  <option value="">Pushto</option>
                </select>
              </div>
              <div
                class="w-full sm:w-auto sm:flex items-center justify-center sm:justify-end"
              >
                <button
                  class="w-full sm:w-20 h-10 text-white hover:border-2 hover:border-red-500 rounded-md hover:font-bold hover:bg-transparent bg-red-500"
                >
                  Sign In
                </button>
              </div>
            </div>
          </div>
        </header>

        <!-- Main Content Portion -->
        <div
          class="max-w-[1170px] mx-auto sm:py-[150px] py-[50px] px-10 text-center">
          <h1
            class="text-[20px] sm:text-[45px] md:text-[50px] text-white font-bold">
            Unlimited movies, TV shows, and more
          </h1>
          <h3 class="py-3 text-[12px] sm:text-[20px] md:text-[25px] text-white">
            Watch anywhere. Cancel anytime.
          </h3>
          <h3 class="py-3 text-[12px] sm:text-[20px] md:text-[25px] text-white">
            Ready to watch? Enter your email to create or restart your
            membership.
          </h3>

          <!-- Login Form -->
          <div class="max-w-[700px] mx-auto">
            <form action="" class="grid sm:grid-cols-[70%_auto] sm:gap-3 gap-3 sm:py-4">
              <input type="text" class="text-white bg-transparent border-2 border-gray-400 pl-2 py-1 sm:py-3 rounded-sm" placeholder="Email address"/>
              <button class="text-lg font-bold hover:bg-red-700 sm:py-3 py-1 rounded-sm text-white bg-[rgb(229,9,20)]">Get Started <b class="text-2xl ml-3">></b></button>
            </form>
          </div>

        </div>
      </div>
    </section>

    <!-- ================== Banner Section End =================== -->

    <!-- ================== Second Section Start =================== -->

    <!-- ================== Second Section End =================== -->

    <!-- ================== Third Section Start =================== -->

    <!-- ================== Third Section End =================== -->

    <!-- ================== Fourth Section Start =================== -->

    <!-- ================== Fourth Section End =================== -->

    <!-- ================== Fifth Section Start =================== -->

    <!-- ================== Fifth Section End =================== -->

    <script src="script.js/"></script>
  </body>
</html>
